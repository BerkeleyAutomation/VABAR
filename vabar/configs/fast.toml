"tool_sort/level2_7" = { max_steps = 20000 }
"tool_sort/level2_8" = { max_steps = 19200 }
"tool_sort/level2_9" = { max_steps = 20000 }
"tool_sort/level2_10" = { max_steps = 20000 }
"tool_sort/level2_11" = { max_steps = 20000 }
"tool_sort/level2_12" = { max_steps = 19200 }
"tool_sort/level2_13" = { max_steps = 20000 }
"tool_sort/level2_14" = { max_steps = 20000 }
"tool_sort/level2_15" = { max_steps = 19200 }
"tool_sort/level2_16" = { max_steps = 20000 }
