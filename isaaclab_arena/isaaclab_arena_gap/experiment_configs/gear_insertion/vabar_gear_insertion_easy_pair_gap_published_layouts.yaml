# AUTOLab's gear_mesh/gap_perception run through
# RoboSimStudio's own policy agent (isaaclab_arena_gap.rss_adapter).
shared:
  environment:
    type: vabar_gear_insertion__easy_pair
    enable_cameras: true
  policy:
    type: isaaclab_arena_gap.gap_remote_policy.GapRemotePolicy
    robot_profile: fr3
    gap_control_frequency_hz: 60
    gap_graph: gear_mesh/gap_perception
    gap_workspace:
      # Arena world frame: the FR3 workcell table top, 0.132 m below the arm base.
      surface_z: 0.78
    auto_spawn: true
    gap_launcher: isaaclab_arena_gap/scripts/run_rss_graph.sh
    gap_host: 127.0.0.1
    gap_io_timeout_s: 180
    policy_device: cuda
    gap_camera: top_camera
    gap_bridge_camera: overhead
    gap_aux_camera: iso_camera
    gap_aux_bridge_camera: iso
    gap_extra_cameras:
      chain_camera: chain
      front_camera: front
  rollout_limit:
    num_episodes: 1
  num_rebuilds: 1

# One Run per benchmark seed, each pinned to one AUTOLab document: the board,
# gears and start poses come from that document's row, and the graph reads the
# same document. Seeds 42-51 map to the documents the RSS comparison runs used.
runs:
  vabar_gear_insertion_easy_pair_gap_s42:
    environment: {layout_names: [gearmesh-easy-pair-15]}
    environment_builder: {placement_seed: 42, seed: 42}
    policy: {gap_inputs: {autolab_task: gear_mesh/gearmesh-easy-pair-15}}
  vabar_gear_insertion_easy_pair_gap_s43:
    environment: {layout_names: [gearmesh-easy-pair-59]}
    environment_builder: {placement_seed: 43, seed: 43}
    policy: {gap_inputs: {autolab_task: gear_mesh/gearmesh-easy-pair-59}}
