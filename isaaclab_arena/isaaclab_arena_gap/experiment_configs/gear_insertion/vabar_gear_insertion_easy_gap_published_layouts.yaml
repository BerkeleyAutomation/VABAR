# AUTOLab's gear_mesh/gap_perception run through
# RoboSimStudio's own policy agent (isaaclab_arena_gap.rss_adapter).
shared:
  environment:
    type: vabar_gear_insertion__easy
    enable_cameras: true
  policy:
    type: isaaclab_arena_gap.gap_remote_policy.GapRemotePolicy
    robot_profile: fr3
    gap_control_frequency_hz: 60
    gap_graph: gear_mesh/gap_perception
    gap_workspace:
      # Arena world frame: the FR3 workcell table top, 0.132 m below the arm base.
      surface_z: 0.78
    auto_spawn: true
    gap_launcher: isaaclab_arena_gap/scripts/run_rss_graph.sh
    gap_host: 127.0.0.1
    gap_io_timeout_s: 180
    policy_device: cuda
    gap_camera: top_camera
    gap_bridge_camera: overhead
    gap_aux_camera: iso_camera
    gap_aux_bridge_camera: iso
    gap_extra_cameras:
      chain_camera: chain
      front_camera: front
  rollout_limit:
    num_episodes: 1
  num_rebuilds: 1

# One Run per benchmark seed, each pinned to one tooth count: AUTOLab's
# gearmesh-easy-single-01..10 counts, in order, for seeds 42-51 (our choice;
# AUTOLab defines no seed mapping for easy). The gear's start pose comes from
# the seeded placement.
runs:
  vabar_gear_insertion_easy_gap_s42:
    environment_builder: {placement_seed: 42, seed: 42}
    variations: {board: {gear_family: {tooth_counts: [20]}}}
  vabar_gear_insertion_easy_gap_s43:
    environment_builder: {placement_seed: 43, seed: 43}
    variations: {board: {gear_family: {tooth_counts: [20]}}}
  vabar_gear_insertion_easy_gap_s44:
    environment_builder: {placement_seed: 44, seed: 44}
    variations: {board: {gear_family: {tooth_counts: [24]}}}
  vabar_gear_insertion_easy_gap_s45:
    environment_builder: {placement_seed: 45, seed: 45}
    variations: {board: {gear_family: {tooth_counts: [24]}}}
  vabar_gear_insertion_easy_gap_s46:
    environment_builder: {placement_seed: 46, seed: 46}
    variations: {board: {gear_family: {tooth_counts: [16]}}}
  vabar_gear_insertion_easy_gap_s47:
    environment_builder: {placement_seed: 47, seed: 47}
    variations: {board: {gear_family: {tooth_counts: [16]}}}
  vabar_gear_insertion_easy_gap_s48:
    environment_builder: {placement_seed: 48, seed: 48}
    variations: {board: {gear_family: {tooth_counts: [16]}}}
  vabar_gear_insertion_easy_gap_s49:
    environment_builder: {placement_seed: 49, seed: 49}
    variations: {board: {gear_family: {tooth_counts: [24]}}}
  vabar_gear_insertion_easy_gap_s50:
    environment_builder: {placement_seed: 50, seed: 50}
    variations: {board: {gear_family: {tooth_counts: [24]}}}
  vabar_gear_insertion_easy_gap_s51:
    environment_builder: {placement_seed: 51, seed: 51}
    variations: {board: {gear_family: {tooth_counts: [20]}}}
