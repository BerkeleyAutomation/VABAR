[project]
name = "isaaclab-arena-vabar"
version = "0.0.0"
description = "Arena-based industrial manipulation benchmark definitions."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isaaclab_arena_vabar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../isaaclab_arena_gap/src", "../external/IsaacLab-Arena", "../tools"]
markers = [
  "live: launches a fresh Isaac Sim process and requires a visible CUDA device",
]
