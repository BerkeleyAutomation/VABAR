default_physics_backend: newton
benchmark_physics:
  solver_cfg:
    enable_multiccd: false
  collision_cfg:
    contact_matching: disabled
  contacts:
    solref: [0.004, 1.0]
    solimp: [0.95, 0.999, 0.0005, 0.5, 2.0]
    finger_mu: 8.0
    finger_mu_torsional: 0.002
    finger_mu_rolling: 0.0001
    gap: 0.0002
    condim: 4
    housing_condim: 3
    stiffness: 62500.0
    damping: 500.0
    finger_equality_solref: [0.004, 1.0]
    friction:
      plug: 0.35
      bulkhead: 2.5
      port: 0.35
      bench: 0.4
      table: 0.35
  cable:
    mu: 0.4
    armature: 0.00002
    joint_friction: 0.002
    contact_gap: 0.0002
    ke: 1000.0
    kd: 300.0
env_cfg_override:
  decimation: 1
  num_rerenders_on_reset: 5
  scene:
    num_envs: 1
  sim:
    dt: 0.016666666666666666
    render_interval: 1
    gravity: [0.0, 0.0, -9.81]
    use_newton_actuators: true
    physics:
      num_substeps: 16
      collision_decimation: 1
      use_cuda_graph: false
      debug_mode: false
      default_shape_cfg:
        gap: 0.0002
      collision_cfg:
        _target_: isaaclab_newton.physics.newton_collision_cfg.NewtonCollisionPipelineCfg
        rigid_contact_max: 8192
      solver_cfg:
        _target_: isaaclab_newton.physics.MJWarpSolverCfg
        solver: newton
        disable_sensors: true
        integrator: implicitfast
        nconmax: 2048
        njmax: 4096
        iterations: 100
        ls_iterations: 50
        cone: elliptic
        impratio: 10.0
        use_mujoco_contacts: false
        # MuJoCo's default, as AUTOLab runs it. Arena's Newton preset sets 15000 for
        # dexterous hands; a resting convex pair whose GJK never converges then costs
        # ~50 ms per call, every substep.
        ccd_iterations: 35
