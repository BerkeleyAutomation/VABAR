external_yaml: syringe_env_config.yaml
env_name: cluttered
embodiment:
  id: fr3
  registry_name: vabar__fr3_robotiq_2f85
  params:
    # AUTOLab's FR3 cell starts its arm at home, and its connector reads the resting
    # tool height from wherever the arm is when a graph first asks.
    initial_joint_pose: [0.0, 0.19634954084936207, 0.0, -2.617993877991494, 0.0, 2.941592653589793, 0.7853981633974483]
    camera_rig: syringe
    initial_pose:
      position_xyz:
      - -0.5
      - -0.1
      - 0.912
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
background:
  id: background
  registry_name: vabar__fr3_workcell_table
  params:
    initial_pose:
      position_xyz:
      - -0.5
      - -0.1
      - 0.912
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
objects:
- id: hdr_shadow_receiver
  registry_name: vabar__hdr_shadow_receiver
  params: {}
- id: sharps_container
  registry_name: vabar__syringe_sort_bin
  params:
    instance_name: sharps_container
    side: destination
    appearance: syringe
- id: instrument_tray
  registry_name: vabar__instrument_tray
  params:
    instance_name: instrument_tray
- id: benchmark_light
  registry_name: vabar__empty_warehouse_dome_light
  params: {}
# AUTOLab's clutter trials hold one textured syringe (syringe_0, the red needle
# cap) and plain spares (its syringe_pack_N, the bare mesh, untextured white).
# perceive_target.py names its syringe by the red pixels inside a mask, so the
# spares here are the blank twin rather than six red-capped copies.
- id: syringe_0
  registry_name: vabar__syringe
  params:
    instance_name: syringe_0
- id: syringe_1
  registry_name: vabar__syringe_blank
  params:
    instance_name: syringe_1
- id: syringe_2
  registry_name: vabar__syringe_blank
  params:
    instance_name: syringe_2
- id: syringe_3
  registry_name: vabar__syringe_blank
  params:
    instance_name: syringe_3
- id: syringe_4
  registry_name: vabar__syringe_blank
  params:
    instance_name: syringe_4
- id: syringe_5
  registry_name: vabar__syringe_blank
  params:
    instance_name: syringe_5
object_references:
- id: table
  parent_id: background
  prim_path: placement_surface
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: table
  params: {}
- kind: 'on'
  subject: instrument_tray
  reference: table
  params:
    clearance_m: 0.0
- kind: position_limits_box
  subject: instrument_tray
  params:
    x_min: 0.05
    x_max: 0.15
    y_min: -0.33
    y_max: -0.23
# AUTOLab's clutter trials keep the tray at yaw 140.4 deg (tray_pair's pose); the
# syringes are laid out in the tray frame (syringe_disposal/clutter_layouts.json).
- kind: rotate_around_solution
  subject: instrument_tray
  params:
    yaw_rad: 2.4504
- kind: 'on'
  subject: sharps_container
  reference: table
  params:
    clearance_m: 0.0
- kind: position_limits_box
  subject: sharps_container
  params:
    # Brought toward the robot from x [0.1475, 0.2475]. The carry
    # reorientation lifts the held syringe to z ~= 1.34 above the aperture, and
    # the FR3/Robotiq USD IK solves to 0.867 m from the base -- measured, it
    # reaches z = 1.15 there and refuses from 1.20. Over x [0.1475, 0.2475] the
    # liftable height ran 0.98-1.35 m, so most draws put that waypoint out of
    # reach and carry_sg.execute aborted.
    x_min: 0.05
    x_max: 0.12
    y_min: 0.1075
    y_max: 0.2075
- kind: 'on'
  subject: syringe_0
  reference: instrument_tray
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: syringe_1
  reference: instrument_tray
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: syringe_2
  reference: instrument_tray
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: syringe_3
  reference: instrument_tray
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: syringe_4
  reference: instrument_tray
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: syringe_5
  reference: instrument_tray
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
task:
  composition: atomic
  description: pick up every syringe from the cluttered instrument tray and drop
    each through the hole in the yellow sharps disposal box
  subtasks:
  - kind: ObjectsCenteredInRegionsTask
    params:
      object_list:
      - syringe_0
      - syringe_1
      - syringe_2
      - syringe_3
      - syringe_4
      - syringe_5
      region_list:
      - sharps_container
      - sharps_container
      - sharps_container
      - sharps_container
      - sharps_container
      - sharps_container
      bounds_xyzxyz:
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      consecutive_success_steps: 50
      episode_length_s: 1368.0
      # The RSS version's t08, t14 and t19 hold five syringes: the scene's sixth lies parked
      # off to the side (syringe_disposal/tray_layouts.py PARKED_BOUNDS_XYZXYZ) and is not scored.
      parked_bounds_xyzxyz: [0.2, 0.8, 0.7, 0.5, 0.95, 0.9]
