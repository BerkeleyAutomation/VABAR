# Level-2 tool pairs with Arena placement and fixed fixtures.
external_yaml: tool_hanging_env_config.yaml
env_name: screwdriver_medium
embodiment:
  id: yam
  registry_name: vabar__bimanual_yam
  params:
    left_mount_position: [0.3025, 0.17, 0.81]
    right_mount_position: [0.3025, -0.17, 0.81]
    # AUTOLab's tool-hanging hand: the crank hand opening to 47.5 mm per finger.
    gripper: crank_4310_wide
    left_initial_joint_pose: [0, 1.047, 1.047, 0, 0, 0]
    right_initial_joint_pose: [0, 1.047, 1.047, 0, 0, 0]
background:
  id: background
  registry_name: vabar__yam_workcell_table
  params:
    initial_pose:
      position_xyz: [0.2525, 0.0, 0.75]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
object_references:
- id: table
  parent_id: background
  prim_path: placement_surface
  object_type: base
  params: {}
objects:
- id: hdr_shadow_receiver
  registry_name: vabar__hdr_shadow_receiver
  params: {}
- id: pegboard_rack
  registry_name: vabar__pegboard_rack
  params:
    instance_name: pegboard_rack
    initial_pose:
      position_xyz: [0.88, -0.16, 1.12800769]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
- id: empty_warehouse_hdr_light
  registry_name: vabar__empty_warehouse_dome_light
  params: {}
- id: rack
  registry_name: vabar__screwdriver_box
  params:
    instance_name: rack
    geometry_profile: upstream
    initial_pose:
      position_xyz: [0.88, 0.0732, 0.85]
      rotation_xyzw: [0.0, 0.0, 1.0, 0.0]
- id: screwdriver_1
  registry_name: vabar__screwdriver_slim
  params:
    instance_name: screwdriver_1
- id: screwdriver_2
  registry_name: vabar__screwdriver_slim
  params:
    instance_name: screwdriver_2
- id: distractor_wrench_1
  registry_name: vabar__wrench_ring_19
  params:
    instance_name: distractor_wrench_1
- id: distractor_scissors_2
  registry_name: vabar__scissor_pair_1
  params:
    instance_name: distractor_scissors_2
relations:
- kind: is_anchor
  subject: table
  params: {}
- kind: is_anchor
  subject: pegboard_rack
  params: {}
- kind: is_anchor
  subject: rack
  params: {}
- kind: 'on'
  subject: screwdriver_1
  reference: table
  params:
    clearance_m: 0.00111538
- kind: at_position
  subject: screwdriver_1
  # Give the in-place upright turn 20 mm more clearance from the arm base.
  params: {x: 0.62, y: 0.14}
- kind: rotate_around_solution
  subject: screwdriver_1
  params: &id001
    yaw_rad: 3.141592653589793
- kind: random_around_solution
  subject: screwdriver_1
  params:
    x_half_m: 0.05
    y_half_m: 0.05
    yaw_half_rad: 0.08726646259971647
- kind: 'on'
  subject: screwdriver_2
  reference: table
  params:
    clearance_m: 0.00111538
- kind: at_position
  subject: screwdriver_2
  params: {x: 0.62, y: -0.14}
- kind: rotate_around_solution
  subject: screwdriver_2
  params: *id001
- kind: random_around_solution
  subject: screwdriver_2
  params:
    x_half_m: 0.05
    y_half_m: 0.05
    yaw_half_rad: 0.08726646259971647
- kind: 'on'
  subject: distractor_wrench_1
  reference: table
  params:
    clearance_m: 0.0
- kind: position_limits
  subject: distractor_wrench_1
  params:
    x_min: 0.4279999316
    x_max: 1.0279999316
    y_min: -0.1785213292
    y_max: 0.6214786708
- kind: rotate_around_solution
  subject: distractor_wrench_1
  params:
    yaw_rad: 3.141592653589793
- kind: random_around_solution
  subject: distractor_wrench_1
  params:
    yaw_half_rad: 3.141592653589793
- kind: 'on'
  subject: distractor_scissors_2
  reference: table
  params:
    clearance_m: 0.004
- kind: position_limits
  subject: distractor_scissors_2
  params:
    x_min: 0.3
    x_max: 0.9
    y_min: -0.4
    y_max: 0.4
- kind: rotate_around_solution
  subject: distractor_scissors_2
  params:
    roll_rad: -1.5707963267948966
    yaw_rad: 1.5707963267948966
- kind: random_around_solution
  subject: distractor_scissors_2
  params:
    yaw_half_rad: 3.141592653589793
task:
  composition: atomic
  description: put both screwdrivers into the box
  subtasks:
  - kind: IndustrialToolHangingTask
    params:
      episode_length_s: 366.6666666666667
      # Scored as the RSS version's screwdrivers_level2.task scores it: each tool hung, at rest and
      # released, held for 1 s (hold-for 1.0), and success ends the episode.
      tools: [screwdriver_1, screwdriver_2]
      fixtures: [rack]
      goals:
      - tool: screwdriver_1
        fixture: rack
        contact_force_n: 0.2
        speed_m_s: 0.15
        # (> (hands-clear TOOL) R), measured from the tool's physical centre (the centre of its
        # collision hulls' bounds): R is the tool's 88 mm radius about it plus 15 mm, rounded up
        # to the centimetre, the RSS version's rule. Its documents state 0.20, about their own origin.
        hands_clear_m: 0.11
        release_point_xyz: [0.08726, 0.0, 0.0]
        containment:
          minimum_xyz: [-0.067, -0.1252, -0.01]
          maximum_xyz: [0.016, -0.0212, 0.141]
          point_xyz: [0.175, 0, 0]
      - tool: screwdriver_2
        fixture: rack
        contact_force_n: 0.2
        speed_m_s: 0.15
        # (> (hands-clear TOOL) R), measured from the tool's physical centre (the centre of its
        # collision hulls' bounds): R is the tool's 88 mm radius about it plus 15 mm, rounded up
        # to the centimetre, the RSS version's rule. Its documents state 0.20, about their own origin.
        hands_clear_m: 0.11
        release_point_xyz: [0.08726, 0.0, 0.0]
        containment:
          minimum_xyz: [-0.067, -0.1252, -0.01]
          maximum_xyz: [0.016, -0.0212, 0.141]
          point_xyz: [0.175, 0, 0]
