external_yaml: tool_hanging_env_config.yaml
fingertip_physics:
  left_torsional_friction: 0.5
  required_shape_tokens: [/plier_1/, /plier_support_left/]
  forbidden_shape_tokens: [/plier_2/, /plier_support_right/]
env_name: plier_easy
embodiment:
  id: yam
  registry_name: vabar__bimanual_yam
  params:
    left_mount_position: [0.3025, 0.17, 0.81]
    right_mount_position: [0.3025, -0.17, 0.81]
    # AUTOLab's tool-hanging hand: the crank hand opening to 47.5 mm per finger.
    gripper: crank_4310_wide
    left_initial_joint_pose: [0, 1.047, 1.047, 0, 0, 0]
    right_initial_joint_pose: [0, 1.047, 1.047, 0, 0, 0]
background:
  id: background
  registry_name: vabar__yam_workcell_table
  params:
    initial_pose:
      position_xyz: [0.2525, 0.0, 0.728]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
object_references:
- id: table
  parent_id: background
  prim_path: placement_surface
  object_type: base
  params: {}
objects:
- id: hdr_shadow_receiver
  registry_name: vabar__hdr_shadow_receiver
  params: {}
- id: pegboard_rack
  registry_name: vabar__pegboard_rack
  params:
    instance_name: pegboard_rack
    initial_pose:
      position_xyz: [0.88, -0.16, 1.12800769]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
- id: plier_support_left
  registry_name: vabar__plier_support_left
  params:
    instance_name: plier_support_left
    initial_pose:
      position_xyz: [0.7498078192, 0.1633992876, 0.9034166456]
      rotation_xyzw: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
- id: empty_warehouse_hdr_light
  registry_name: vabar__empty_warehouse_dome_light
  params: {}
- id: plier_1
  registry_name: vabar__plier_combination
  params:
    instance_name: plier_1
relations:
- kind: is_anchor
  subject: table
  params: {}
- kind: is_anchor
  subject: pegboard_rack
  params: {}
- kind: is_anchor
  subject: plier_support_left
  params: {}
- kind: 'on'
  subject: plier_1
  reference: table
  params: {clearance_m: 0.004}
- kind: position_limits
  subject: plier_1
  params:
    x_min: 0.58
    x_max: 0.62
    y_min: -0.02
    y_max: 0.02
task:
  composition: atomic
  description: hang the pliers on the triangular support
  subtasks:
  - kind: IndustrialToolHangingTask
    params:
      episode_length_s: 141.66666666666666
      # Scored on the episode's final state, exactly as AUTOLab v1.0 scores tool hanging.
      tools: [plier_1]
      fixtures: [plier_support_left]
      goals:
      - tool: plier_1
        fixture: plier_support_left
        containment:
          minimum_xyz: [0.072, -0.203, -0.02]
          maximum_xyz: [0.143, -0.123, 0.1]
        contact_force_n: 0.2
        speed_m_s: 0.15
