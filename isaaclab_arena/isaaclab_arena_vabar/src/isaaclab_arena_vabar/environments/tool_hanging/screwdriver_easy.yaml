external_yaml: tool_hanging_env_config.yaml
env_name: screwdriver_easy
embodiment:
  id: yam
  registry_name: vabar__bimanual_yam
  params:
    left_mount_position: [0.3025, 0.17, 0.81]
    right_mount_position: [0.3025, -0.17, 0.81]
    # AUTOLab's tool-hanging hand: the crank hand opening to 47.5 mm per finger.
    gripper: crank_4310_wide
    left_initial_joint_pose: [0, 1.047, 1.047, 0, 0, 0]
    right_initial_joint_pose: [0, 1.047, 1.047, 0, 0, 0]
background:
  id: background
  registry_name: vabar__yam_workcell_table
  params:
    initial_pose:
      position_xyz: [0.2525, 0.0, 0.728]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
object_references:
- id: table
  parent_id: background
  prim_path: placement_surface
  object_type: base
  params: {}
objects:
- id: hdr_shadow_receiver
  registry_name: vabar__hdr_shadow_receiver
  params: {}
- id: pegboard_rack
  registry_name: vabar__pegboard_rack
  params:
    instance_name: pegboard_rack
    initial_pose:
      position_xyz: [0.88, -0.16, 1.12800769]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
- id: rack
  registry_name: vabar__screwdriver_box
  params:
    instance_name: rack
    # AUTOLab v1.0's stored screwdriver_box.stl, which screwdrivers_level1 stands;
    # the default box.usda follows the box generator's older, lower walls.
    geometry_profile: upstream
    initial_pose:
      position_xyz: [0.88, 0.0732, 0.85]
      rotation_xyzw: [0.0, 0.0, 1.0, 0.0]
- id: empty_warehouse_hdr_light
  registry_name: vabar__empty_warehouse_dome_light
  params: {}
- id: screwdriver_1
  registry_name: vabar__screwdriver_slim
  params:
    instance_name: screwdriver_1
relations:
- kind: is_anchor
  subject: table
  params: {}
- kind: is_anchor
  subject: pegboard_rack
  params: {}
- kind: is_anchor
  subject: rack
  params: {}
- kind: 'on'
  subject: screwdriver_1
  reference: table
  params: {clearance_m: 0.00111538}
- kind: position_limits
  subject: screwdriver_1
  params:
    x_min: 0.58
    x_max: 0.62
    y_min: -0.02
    y_max: 0.02
- kind: rotate_around_solution
  subject: screwdriver_1
  params:
    yaw_rad: 3.141592653589793
task:
  composition: atomic
  description: put the screwdriver upright into the small box on the pegboard
  subtasks:
  - kind: IndustrialToolHangingTask
    params:
      episode_length_s: 141.66666666666666
      # Scored as the RSS version's screwdrivers_level1.task scores it: each tool hung, at rest and
      # released, held for 1 s (hold-for 1.0), and success ends the episode.
      tools: [screwdriver_1]
      fixtures: [rack]
      goals:
      - tool: screwdriver_1
        fixture: rack
        contact_force_n: 0.2
        speed_m_s: 0.15
        # (> (hands-clear TOOL) R), measured from the tool's physical centre (the centre of its
        # collision hulls' bounds): R is the tool's 88 mm radius about it plus 15 mm, rounded up
        # to the centimetre, the RSS version's rule. Its documents state 0.20, about their own origin.
        hands_clear_m: 0.11
        release_point_xyz: [0.08726, 0.0, 0.0]
        containment:
          minimum_xyz: [-0.067, -0.1252, -0.01]
          maximum_xyz: [0.016, -0.0212, 0.141]
          point_xyz: [0.175, 0, 0]
