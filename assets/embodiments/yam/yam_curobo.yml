robot_cfg:
  kinematics:
    format_version: 2.0
    urdf_path: i2rt_yam/urdf/yam.urdf
    asset_root_path: i2rt_yam/urdf
    base_link: base_link
    tool_frames: [link_6]
    collision_link_names: [base_link, link_1, link_2, link_3, link_4, link_5, link_6]
    mesh_link_names: [base_link, link_1, link_2, link_3, link_4, link_5, link_6]
    collision_sphere_buffer: 0.005
    cspace:
      joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
      default_joint_position: [0.0, 1.047, 1.047, 0.0, 0.0, 0.0]
      null_space_weight: [1, 1, 1, 1, 1, 1]
      cspace_distance_weight: [1, 1, 1, 1, 1, 1]
      max_acceleration: 8.0
      max_jerk: 300.0
    self_collision_ignore:
      base_link: [link_1, link_2]
      link_1: [link_2, link_3]
      link_2: [link_3, link_4]
      link_3: [link_4, link_5]
      link_4: [link_5, link_6]
      link_5: [link_6]
    self_collision_buffer:
      base_link: 0.01
      link_1: 0.01
      link_2: 0.005
      link_3: 0.005
      link_4: 0.005
      link_5: 0.005
      link_6: 0.005
    # Conservative primitives around the link chains. These are intentionally
    # slightly larger than the render meshes; planning against an optimistic
    # robot model would invalidate clearance results.
    collision_spheres:
      base_link:
        - {center: [0.0, 0.0, 0.025], radius: 0.065}
      link_1:
        - {center: [0.0, 0.0, 0.02], radius: 0.060}
      link_2:
        - {center: [0.035, 0.0, 0.0], radius: 0.047}
        - {center: [0.095, 0.0, 0.0], radius: 0.047}
        - {center: [0.155, 0.0, 0.0], radius: 0.047}
        - {center: [0.215, 0.0, 0.0], radius: 0.047}
        - {center: [0.255, 0.0, 0.0], radius: 0.047}
      link_3:
        - {center: [-0.035, -0.009, 0.0], radius: 0.048}
        - {center: [-0.095, -0.023, 0.0], radius: 0.048}
        - {center: [-0.155, -0.038, 0.0], radius: 0.048}
        - {center: [-0.215, -0.053, 0.0], radius: 0.048}
      link_4:
        - {center: [-0.025, -0.013, 0.0], radius: 0.045}
        - {center: [-0.060, -0.032, 0.0], radius: 0.045}
      link_5:
        - {center: [0.0, 0.015, 0.017], radius: 0.043}
        - {center: [0.0, 0.030, 0.035], radius: 0.043}
      link_6:
        - {center: [0.0, 0.0, 0.025], radius: 0.050}
        - {center: [0.0, 0.0, 0.070], radius: 0.050}
        - {center: [0.0, 0.0, 0.115], radius: 0.050}
